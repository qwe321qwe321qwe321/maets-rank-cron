name: Steam Wishlist Rank Crawler

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node crawl.js

      - name: Commit wishlist_rank.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wishlist_rank.csv
          git diff --cached --quiet || git commit -m "Update wishlist_rank.csv $(date -u +'%Y-%m-%d')"
          git push
