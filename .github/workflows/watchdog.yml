name: Workflow Watchdog

# maets-crons has few commits, so GitHub may disable its scheduled workflows after
# 60 days of inactivity. This repo commits daily and stays active, so it watches from here.
# A failed run triggers GitHub's failure email; set the DISCORD_WEBHOOK_URL secret to also post to Discord.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check maets-crons workflow states
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          bad=$(gh api repos/qwe321qwe321qwe321/maets-crons/actions/workflows \
            --jq '.workflows[] | select(.state != "active") | "\(.name) (\(.state))"')
          if [ -z "$bad" ]; then
            echo "All maets-crons workflows are active"
            exit 0
          fi
          echo "::error::Inactive maets-crons workflows:"
          echo "$bad"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            msg=$(printf '⚠️ maets-crons workflow 未啟用:\n%s\nhttps://github.com/qwe321qwe321qwe321/maets-crons/actions' "$bad")
            jq -n --arg c "$msg" '{content: $c}' | curl -sf -X POST \
              -H "Content-Type: application/json" --data @- "$DISCORD_WEBHOOK_URL" > /dev/null
          fi
          exit 1
